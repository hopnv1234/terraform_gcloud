apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-qradar-config
  namespace: ibm-techxchange-lab
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/falco-*.log
      pos_file /var/log/fluentd-falco.log.pos
      tag falco.*
      <parse>
        @type none
      </parse>
    </source>

    <match falco.**>
      @type remote_syslog
      host 192.168.210.227
      port 514
      protocol udp
      program falco-fluentd
      severity debug
      facility user
      <buffer>
      </buffer>
      <format>
        @type single_value
        message_key message
      </format>
    </match>